spring.application.name=backend

# Active Profile
spring.profiles.active=dev

# Server Configuration
server.port=8081

# ================= JWT =================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ================= File Upload =================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ================= Mail Configuration =================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# ================= ACTUATOR =================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always

management.info.env.enabled=true
info.app.name=DevAI Hub Backend

info.app.version=1.0.0

info.app.description=Project Management System API

info.app.developer=Aadesh Kumar

# ================= LOGGING =================

logging.level.root=INFO
logging.level.com.devaihub.backend=DEBUG

logging.file.name=logs/devaihub.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
spring.jpa.open-in-view=false